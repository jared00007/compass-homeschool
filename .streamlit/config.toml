[server]
headless = true

[browser]
gatherUsageStats = false

# Streamlit reads this file once, at startup, so it cannot be the theme picker —
# see compass/theme.py, which repaints the app's surfaces at runtime instead.
#
# What this section is for is everything the injected CSS can't reach: the insides
# of dropdown popovers, date pickers, scrollbars, and the compliance dataframe
# (rendered to a canvas, not DOM). Kept in step with compass/theme.py's five
# themes -- light, as of the redesign that moved all five off a dark backdrop --
# so those native surfaces already look right underneath whichever theme is
# showing. Values match BACKDROP_BG/BACKDROP_SIDE in theme.py. Changing this file
# needs an app relaunch; it is not something the runtime picker can do.
[theme]
base = "light"
backgroundColor = "#FBF7EE"
secondaryBackgroundColor = "#F3ECDA"
textColor = "#1C1A16"
primaryColor = "#D9622B"
borderColor = "#E4DFD4"
baseRadius = "small"
font = "-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
codeFont = "SF Mono, Menlo, Consolas, monospace"
showWidgetBorder = true
