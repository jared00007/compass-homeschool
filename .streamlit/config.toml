[server]
headless = true

[browser]
gatherUsageStats = false

# Streamlit reads this file once, at startup, so it can't be where the app's
# real look lives -- see compass/theme.py, which repaints the app's surfaces at
# runtime instead (and is the one fixed theme, not a picker).
#
# What this section is for is everything the injected CSS can't reach: the insides
# of dropdown popovers, date pickers, scrollbars, and the compliance dataframe
# (rendered to a canvas, not DOM). Kept in step with compass/theme.py -- light --
# so those native surfaces already look right underneath it. Values match
# BACKDROP_BG/BACKDROP_SIDE in theme.py. Changing this file needs an app relaunch.
[theme]
base = "light"
backgroundColor = "#FBF7EE"
secondaryBackgroundColor = "#F3ECDA"
textColor = "#1C1A16"
primaryColor = "#D9622B"
borderColor = "#E4DFD4"
baseRadius = "small"
font = "-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
codeFont = "SF Mono, Menlo, Consolas, monospace"
showWidgetBorder = true
