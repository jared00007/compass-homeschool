name: CI

# Run the full test suite on every push and pull request. No secrets are
# needed -- the suite mocks the LLM, so nothing here touches the Anthropic API.
on:
  push:
    # `stable` is a deploy pointer advanced by this workflow -- don't re-test it.
    branches-ignore:
      - stable
  pull_request:

# A newer push to the same branch cancels an in-flight run for it, so the queue
# never backs up on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Configure git identity
        # A few tests (e.g. the update-script test) spin up scratch git repos and
        # commit into them; a bare CI runner has no global identity set.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Compass CI"

      - name: Run the test suite
        run: python -m pytest -q

  # "Deploy": advance the `stable` branch to this commit, but ONLY after the
  # suite passed and ONLY on the main line. Your Mac's ./scripts/update.sh
  # follows `stable`, so it can never pull a red build. Uses the built-in
  # GITHUB_TOKEN -- no personal token to create or rotate.
  publish-stable:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/homeschool-app-build-mqobsu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Advance the tested "stable" branch
        run: git push --force origin HEAD:refs/heads/stable
